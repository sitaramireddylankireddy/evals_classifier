# Copy this file to config.toml and adjust it. Every key is optional;
# the values shown here are the defaults.
# Patterns are regular expressions, written in single quotes so that
# backslashes are kept as they are.

# Settings for the golden-set harness (python -m evalsvc.cli.run_eval).
[golden]
label_key = "label"
failure_value = "ungrounded"   # the answer has unsupported content
pass_value = "grounded"
category_key = "category"
min_group_size = 20            # smaller groups are marked unreliable in the report

[sweep]
start = 0.05
stop = 0.95
step = 0.05
recall_target = 0.9

[run]
# Share of evaluable items sent to the judge whatever their verdict. Failed items always go.
sample_rate = 0.02
sample_seed = "evalsvc"

[store]
kind = "jsonl"
# Folder for result records. Records hold customer text, so protect this folder
# like the source data.
path = "store"
write_retries = 3

[judge]
kind = "stub"            # the real judge is connected later
timeout_seconds = 60

[input]
parser = "json_list"
key_id = "id"
key_question = "question"
key_evidence = "evidence"
key_answer = "answer"

[chunking]
min_tokens = 300
max_tokens = 500
max_heading_chars = 120
# A line is a heading when it matches one of these and does not end like a sentence.
heading_patterns = [
    '^#{1,6}\s+\S',
    '^\d+(?:\.\d+)*\.?\s+[A-Z]',
    '^[A-Z][A-Z \-]{3,60}$',
    '(?i)^(?:section|clause|article|part|chapter|schedule|appendix)\s+\d',
]

[sentences]
# "blank_en" needs no downloaded language model. Any installed spaCy pipeline name also works.
spacy_pipeline = "blank_en"

# Sentences matching one of these rules are left out of scoring, unless they
# contain an amount, a date, a percentage, or a reference.
[[sentences.non_factual_rules]]
name = "apology"
pattern = '(?i)\b(?:sorry|apologi[sz]e|apologies)\b'

[[sentences.non_factual_rules]]
name = "empathy"
pattern = '(?i)\b(?:we|i) (?:understand|appreciate|realise|realize)\b'

[[sentences.non_factual_rules]]
name = "thanks"
pattern = '(?i)^\W*thank(?:s| you)\b'

[[sentences.non_factual_rules]]
name = "next_step"
pattern = '(?i)\b(?:please (?:contact|let us know|get in touch)|if you have any (?:further |other )?questions|do not hesitate)\b'

[checks]
currencies = ["GBP"]
reference_patterns = [
    '(?i)\b(?:section|clause|paragraph|article)\s+\d+(?:\.\d+)*[a-z]?\b',
]

[model]
# "auto" runs the large model when a GPU is available and the base model otherwise.
# "large" or "base" forces one of them.
select = "auto"
device = "auto"          # "auto", "cpu", or "cuda"
batch_size = 4
# Most tokens in one pass: prompt, evidence, and answer together. The models can read
# 8192, but the lettucedetect package trains and runs them at 4096, so that is the default.
max_tokens = 4096

# For each model: `path` is the local folder that holds the weights, for example
# "C:/models/lettucedect-large-modernbert-en-v1". The service never downloads a model.
# `revision` is the pinned commit hash of the model. It is recorded in every result.
# A model can also have its own `threshold = 0.6`, chosen from the golden set.
# Without one, the threshold in [detection] is used.
[model.large]
name = "lettucedect-large-modernbert-en-v1"
path = ""
revision = ""

[model.base]
name = "lettucedect-base-modernbert-en-v1"
path = ""
revision = ""

[detection]
threshold = 0.5
window_evidence_tokens = 6000
window_overlap_tokens = 500
safety_margin_tokens = 32
