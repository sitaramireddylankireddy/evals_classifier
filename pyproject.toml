[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalsvc"
version = "0.1.0"
description = "Groundedness (hallucination) detection service"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["evalsvc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the model weights on local disk",
]
addopts = "-m 'not slow'"
